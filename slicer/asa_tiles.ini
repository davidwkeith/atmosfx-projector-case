# PrusaSlicer overrides for the ASA base and lid tiles (docs/PRINTING.md, "Settings").
# Load on top of the stock MK3S profiles: 0.20mm SPEED @MK3 + Generic ASA (or Prusament ASA).
# Only the keys below change; everything else comes from those profiles.
# Not set here: nozzle temperature (spool's figure + 5-10 C) and the enclosure.

# 3 mm wall prints solid instead of 2 perimeters over infill
perimeters = 7

# Floor bridges between foot_ribs: enough top layers to cover the sag
top_solid_layers = 7
top_solid_min_thickness = 1.4
fill_density = 25%

# ASA: less part cooling so layers do not split (bridges keep the profile's 30%)
min_fan_speed = 15
max_fan_speed = 15

# Warping. base_front: stack asa_base_front.ini after this file
brim_width = 5
