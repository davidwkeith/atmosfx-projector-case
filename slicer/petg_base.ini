# PrusaSlicer overrides for the two base tiles in PETG (docs/PRINTING.md, "Settings"), from 2026-10-25:
# base_front lifted off the bed twice in ASA. Load on top of the stock MK3S profiles: 0.20mm SPEED @MK3 +
# Prusament PETG (or Generic PETG). Same geometry settings as asa_tiles.ini; PETG keeps its stock cooling.

# 3 mm wall prints solid instead of 2 perimeters over infill
perimeters = 7

# Floor bridges between foot_ribs: enough top layers to cover the sag
top_solid_layers = 7
top_solid_min_thickness = 1.4
fill_density = 25%

brim_width = 5
