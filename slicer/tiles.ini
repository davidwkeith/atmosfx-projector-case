# PrusaSlicer overrides for the base and lid tiles and split_test (docs/PRINTING.md, "Settings").
# Load on top of the stock MK3S profiles: the part's print profile + Prusament PETG (or Generic PETG).
# Only the keys below change; everything else, cooling included, comes from those profiles.

# 3 mm wall prints solid instead of 2 perimeters over infill
perimeters = 7

# Floor bridges between foot_ribs: enough top layers to cover the sag
top_solid_layers = 7
top_solid_min_thickness = 1.4
fill_density = 25%

# Warping. base_front and lid_front: stack front_tiles.ini after this file
brim_width = 5
