ehind</tspan><tspan x="870.3000000000001" dy="10">the projection</tspan></text><text x="788.4149686202003" y="381.0150311193865" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="788.4149686202003" dy="10">16 AWG zip cord, stripe to +,</tspan><tspan x="788.4149686202003" dy="10">out through the floor chimney</tspan></text><text x="399.6149686202003" y="429.21503111938654" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="399.6149686202003" dy="10">Never connect the brick to the projector: the first one died after running on it in the case (2026-10-30). Two supplies: their minuses meet only through the HDMI shield.</tspan></text></svg>