ze="10" font-family="sans" text-anchor="start"><tspan x="95.39999999999999" dy="10">L  black / smooth / narrow blade</tspan></text><text x="95.39999999999999" y="-20.8" dominant-baseline="central" fill="#757575" font-size="10" font-family="sans" text-anchor="start"><tspan x="95.39999999999999" dy="10">N  white / ribbed / wide blade</tspan></text><text x="95.39999999999999" y="29.599999999999994" dominant-baseline="central" fill="#2e7d32" font-size="10" font-family="sans" text-anchor="start"><tspan x="95.39999999999999" dy="10">E  green; land it anyway</tspan></text><text x="115.20000000000002" y="-124.39999999999999" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="middle"><tspan x="115.20000000000002" dy="10">Standard cord with the brick's molded plug, not cut. Not outdoor-rated:</tspan><tspan x="115.20000000000002" dy="10">owner accepts one month outside; inspect daily, replace if damaged.</tspan><tspan x="115.20000000000002" dy="10">Every plug joint in a weatherproof box, off the ground. Drip loop.</tspan></text><text x="252.0" y="66.39999999999999" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="end"><tspan x="252.0" dy="10">cord clamp</tspan><tspan x="252.0" dy="10">(rear-left corner;</tspan><tspan x="252.0" dy="10">grips the jacket)</tspan></text><text x="255.6" y="-139.6" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="end"><tspan x="255.6" dy="10">OUTSIDE</tspan></text><text x="284.40000000000003" y="-139.6" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="284.40000000000003" dy="10">INSIDE: power shelf</tspan></text><text x="349.20000000000005" y="-74.8" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="middle"><tspan x="349.20000000000005" dy="10">L, N, E inside one molded cord</tspan></text><text x="448.20000000000005" y="-60.39999999999998" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="448.20000000000005" dy="10">L</tspan></text><text x="448.20000000000005" y="-10.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="448.20000000000005" dy="10">N</tspan></text><text x="448.20000000000005" y="40.4" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="448.20000000000005" dy="10">E</tspan></text><text x="595.8000000000001" y="-31.599999999999987" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="end"><tspan x="595.8000000000001" dy="10">+</tspan></text><text x="595.8000000000001" y="11.600000000000001" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="end"><tspan x="595.8000000000001" dy="10">-</tspan></text><text x="525.6" y="-23.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="525.6" dy="10">Parts Express brick</tspan><tspan x="525.6" dy="10">24 V 5 A, 120 W</tspan><tspan x="525.6" dy="10">AC inlet (type: read the label)</tspan></text><text x="684.0000000000001" y="-37.19999999999999" dominant-baseline="central" fill="#c62828" font-size="12" font-family="sans" text-anchor="start"><tspan x="684.0000000000001" dy="12">24 V +</tspan></text><text x="684.0000000000001" y="6.0000000000000036" dominant-baseline="central" fill="#212121" font-size="12" font-family="sans" text-anchor="start"><tspan x="684.0000000000001" dy="12">24 V -</tspan></text><text x="684.0000000000001" y="48.39999999999999" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="684.0000000000001" dy="10">DC cord, not cut:</tspan><tspan x="684.0000000000001" dy="10">plugs into the Y-splitter</tspan><tspan x="684.0000000000001" dy="10">(wiring-lv-power.svg)</tspan></text><text x="284.40000000000003" y="306.8" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="284.40000000000003" dy="10">No AC fuse and no hand-wired AC: the cord and the brick are listed, molded parts; the GFCI is upstream. Flame-retardant (V-0) PETG for the shelf.</tspan></text></svg>