="550.8000000000001" y="-20.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="550.8000000000001" dy="10">Rewireable</tspan><tspan x="550.8000000000001" dy="10">IEC connector</tspan><tspan x="550.8000000000001" dy="10">C7 / C5 / C13</tspan></text><text x="653.4" y="-10.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="653.4" dy="10">AC</tspan></text><text x="765.0" y="-27.28" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="end"><tspan x="765.0" dy="10">+</tspan></text><text x="765.0" y="7.280000000000001" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="end"><tspan x="765.0" dy="10">-</tspan></text><text x="712.8000000000001" y="-23.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="712.8000000000001" dy="10">DC brick</tspan><tspan x="712.8000000000001" dy="10">unmodified</tspan><tspan x="712.8000000000001" dy="10">label: DC 21 V 3 A</tspan></text><text x="712.8000000000001" y="71.39999999999999" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="middle"><tspan x="712.8000000000001" dy="10">The stock brick feeds the projector alone;</tspan><tspan x="712.8000000000001" dy="10">5 A or more to run the Pi, amp and fans too.</tspan></text><text x="842.4" y="-139.6" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="middle"><tspan x="842.4" dy="10">barrier</tspan></text><text x="847.8" y="42.6" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="847.8" dy="10">notch at the</tspan><tspan x="847.8" dy="10">barrier foot</tspan></text><text x="889.1999999999999" y="-32.879999999999995" dominant-baseline="central" fill="#c62828" font-size="12" font-family="sans" text-anchor="start"><tspan x="889.1999999999999" dy="12">+ 21 V</tspan></text><text x="889.1999999999999" y="6.0" dominant-baseline="central" fill="#212121" font-size="12" font-family="sans" text-anchor="start"><tspan x="889.1999999999999" dy="12">-</tspan></text><text x="889.1999999999999" y="71.39999999999999" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="889.1999999999999" dy="10">to the low-voltage side</tspan><tspan x="889.1999999999999" dy="10">(wiring-lv-power.svg)</tspan></text><text x="255.6" y="108.8" dominant-baseline="central" fill="#555555" font-size="10" font-family="sans" text-anchor="start"><tspan x="255.6" dy="10">Every AC joint inside a connector shell or heat-shrink; no bare metal. Flame-retardant (V-0) PETG for the shelf.</tspan></text></svg>