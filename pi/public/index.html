<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>VideoFX</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <nav id="nav" aria-label="Sections"></nav>

  <div id="content">
  <header id="now" class="now"><div class="wrap now-inner">
    <a id="now-link" class="now-link" href="#/dashboard" title="Open the dashboard">
      <div class="poster"><img id="now-poster" alt="" hidden><span id="now-placeholder"></span></div>
      <div class="now-text">
        <div class="now-top"><h1 id="name">VideoFX</h1><span id="state" class="pill">…</span></div>
        <p id="now-title" class="now-title">Nothing playing</p>
        <div class="now-time"><span id="now-elapsed"></span><span class="now-bar"><span id="now-progress"></span></span></div>
      </div>
    </a>
    <button id="now-toggle" type="button" class="icon now-toggle" aria-label="Play" disabled></button>
  </div><div class="wrap now-vol">
    <button id="vol-mute" type="button" class="icon" aria-label="Mute" aria-pressed="false" disabled></button>
    <input id="vol-slider" type="range" min="0" max="100" step="1" value="30" aria-label="Speaker volume" disabled>
    <output id="vol-out" for="vol-slider">…</output>
  </div></header>
  <div class="wrap">

    <div id="dmx-strip" class="banner dmx" role="status" hidden>
      <p><b>DMX in control.</b> Power and volume are locked until the signal stops.</p>
    </div>
    <div id="restart-strip" class="banner" role="status" hidden>
      <p>Some changes need a service restart.</p>
      <button id="restart-now" type="button" class="primary">Restart service</button>
    </div>

    <div class="titlebar">
      <h2 id="view-title"></h2>
      <div class="tools">
        <a id="docs-link" href="#/docs">Docs</a>
        <button id="help-btn" type="button" class="icon" aria-label="Help for this screen" title="Help"></button>
      </div>
    </div>

    <main id="view" tabindex="-1"></main>
  </div></div>

  <div id="apply-bar" class="apply" role="region" aria-label="Unsaved changes" hidden></div>

  <dialog id="help" aria-label="Help">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Help</h2>
        <button id="help-close" type="button" class="icon" aria-label="Close help"></button>
      </div>
      <div id="help-body" class="md"></div>
    </div>
  </dialog>

  <p id="toast" role="status" aria-live="polite" hidden></p>
</body>
</html>
