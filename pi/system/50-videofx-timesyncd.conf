# /etc/systemd/timesyncd.conf.d/50-videofx.conf
# pool.ntp.org after any servers from DHCP (added at runtime by the NetworkManager
# dispatcher script). timesyncd keeps its last time in /var/lib/systemd/timesync
# (bind-mounted onto the data partition) so the clock never goes backwards
# across reboots even without an RTC.
[Time]
FallbackNTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
