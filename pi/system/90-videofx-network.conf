# /etc/NetworkManager/conf.d/90-videofx-network.conf
# Wi-Fi power save off (it causes latency spikes and missed mDNS/Matter
# traffic on the Pi's Wi-Fi). Ethernet preferred when plugged in: lower route
# metric; Wi-Fi stays up as a fallback.
[connection-videofx-wifi]
match-device=type:wifi
wifi.powersave=2
ipv4.route-metric=600
ipv6.route-metric=600

[connection-videofx-ethernet]
match-device=type:ethernet
ipv4.route-metric=100
ipv6.route-metric=100
