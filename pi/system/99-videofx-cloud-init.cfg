# /etc/cloud/cloud.cfg.d/99-videofx.cfg, installed by videofx's setup.sh where
# cloud-init exists (the release image; Raspberry Pi OS trixie set up by Imager).
#
# Every VideoFX Pi names itself videofx-xxxx from its MAC (videofx-hostname.service).
# Leave the hostname to it, even when Imager's user-data sets one.
preserve_hostname: true
# videofx-storage lays out the card on first boot (bigger root, data partition).
# cloud-init must not grow the root over the whole card first.
growpart:
  mode: 'off'
resize_rootfs: false
