# /etc/asound.conf - installed by setup.sh. Default ALSA output is the Raspberry Pi
# DigiAMP+ (card id DigiAMP: ALSA keeps only the last word of its "RPi DigiAMP+" name), chosen by card name (card numbers can change between boots).
pcm.!default {
  type plug
  slave.pcm "hw:CARD=DigiAMP,DEV=0"
}
ctl.!default {
  type hw
  card DigiAMP
}
