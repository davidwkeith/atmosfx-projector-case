# /etc/asound.conf - installed by setup.sh. Default ALSA output is the Raspberry Pi
# DigiAMP+ (card id RPiDigiAMP, from its "RPi DigiAMP+" name), chosen by card name (card numbers can change between boots).
pcm.!default {
  type plug
  slave.pcm "hw:CARD=RPiDigiAMP,DEV=0"
}
ctl.!default {
  type hw
  card RPiDigiAMP
}
