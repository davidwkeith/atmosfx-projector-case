name: Build STLs
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  stl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: make parts
      - name: Interference checks
        run: scripts/check_clash.sh
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stl
          path: stl/*.stl
  pi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pi/package-lock.json
      - run: npm ci
      - run: npx vitest run
  image:
    # The public Pi image (pi/image/build.sh --generic): about an hour of pi-gen,
    # so only for releases and by hand. Native arm64 runner: no qemu.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pi/image/build.sh --generic
      - name: Checksum and Imager OS list
        working-directory: pi/deploy
        run: |
          img=$(ls videofx-*-arm64.img.xz)
          sha256sum "$img" > "$img.sha256"
          ../tools/imager-json.sh "$img" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$img" > videofx-imager.json
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            pi/deploy/*.img.xz
            pi/deploy/*.img.xz.sha256
            pi/deploy/videofx-imager.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [stl, pi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stl
          path: stl
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: pi/deploy
      - run: pi/tools/make-release.sh
      - run: gh release create "$GITHUB_REF_NAME" stl/*.stl pi/dist/*.tar.gz pi/deploy/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
